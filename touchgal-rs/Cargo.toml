[workspace]
resolver = "2"
members = ["crates/touchgal-core", "crates/touchgal-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/KunMoe/kun-touchgal-next"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
wreq = "0.16"
wreq-util = "0.2"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
